<div class="resume-container" style="font-family: 'Inter', sans-serif; padding: 16px; color: #f4f4f5; background: #09090b; height: 100%; box-sizing: border-box; overflow: hidden; display: flex; flex-col: column; justify-content: space-between;">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
    <!-- Header -->
    <div style="border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px;">
      <h3 style="font-size: 16px; font-weight: 800; margin: 0; color: #ffffff; letter-spacing: 0.05em; text-transform: uppercase;">{{applicantName}}</h3>
      <p style="font-size: 11px; font-weight: 600; margin: 2px 0 0 0; color: #FF7A00;">{{jobTitle}}</p>
      <p style="font-size: 8px; color: #71717a; margin: 2px 0 0 0;">{{industry}} &bull; {{experience}}</p>
    </div>

    <!-- Summary -->
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h4 style="font-size: 9px; font-weight: 700; margin: 0; color: #FF8A33; text-transform: uppercase; letter-spacing: 0.05em;">Professional Profile</h4>
      <p style="font-size: 8px; line-height: 1.3; color: #d4d4d8; margin: 0;">{{bio}}</p>
    </div>

    <!-- Experience -->
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h4 style="font-size: 9px; font-weight: 700; margin: 0; color: #FF8A33; text-transform: uppercase; letter-spacing: 0.05em;">Work Experience</h4>
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 9px; font-weight: 700; color: #ffffff;">{{jobTitle}}</span>
        <span style="font-size: 7px; color: #71717a;">Present</span>
      </div>
      <p style="font-size: 8px; font-weight: 600; color: #a1a1aa; margin: 0;">{{targetCompany}}</p>
      <p style="font-size: 8px; line-height: 1.3; color: #d4d4d8; margin: 2px 0 0 0;">{{jobDescription}}</p>
    </div>

    <!-- Technical Skills -->
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h4 style="font-size: 9px; font-weight: 700; margin: 0; color: #FF8A33; text-transform: uppercase; letter-spacing: 0.05em;">Technical Skills</h4>
      <p style="font-size: 8px; color: #d4d4d8; margin: 0;">{{skills}}</p>
    </div>

    <!-- Education -->
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h4 style="font-size: 9px; font-weight: 700; margin: 0; color: #FF8A33; text-transform: uppercase; letter-spacing: 0.05em;">Education</h4>
      <p style="font-size: 8px; color: #d4d4d8; margin: 0;">{{education}}</p>
    </div>
  </div>

  <!-- Footer -->
  <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 4px; display: flex; justify-content: space-between; font-size: 7px; color: #52525b; text-transform: uppercase; font-weight: 600;">
    <span>PhoenixAI Studio Career Builder</span>
    <span>Page 1 of 1</span>
  </div>
</div>
