<div class="resume-container" style="font-family: 'Inter', sans-serif; padding: 16px; color: #f4f4f5; background: #0b0717; height: 100%; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;">
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
    <!-- Header -->
    <div style="border-bottom: 1px solid rgba(168,85,247,0.2); padding-bottom: 6px; display: flex; justify-content: space-between; align-items: flex-start;">
      <div>
        <h3 style="font-size: 16px; font-weight: 800; margin: 0; color: #ffffff; text-transform: uppercase;">{{applicantName}}</h3>
        <p style="font-size: 10px; font-weight: 600; margin: 2px 0 0 0; color: #a855f7;">{{jobTitle}}</p>
      </div>
      <div style="text-align: right; font-size: 7px; color: #c084fc; line-height: 1.4;">
        <p style="margin:0;">{{website}}</p>
        <p style="margin:0;">{{github}}</p>
      </div>
    </div>

    <!-- Summary -->
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h4 style="font-size: 9px; font-weight: 700; margin: 0; color: #c084fc; text-transform: uppercase; letter-spacing: 0.05em;">Aurora Summary</h4>
      <p style="font-size: 8px; line-height: 1.3; color: #e9d5ff; margin: 0;">{{bio}}</p>
    </div>

    <!-- Experience -->
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h4 style="font-size: 9px; font-weight: 700; margin: 0; color: #c084fc; text-transform: uppercase; letter-spacing: 0.05em;">Work Experience</h4>
      <div>
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 9px; font-weight: 700; color: #ffffff;">{{jobTitle}}</span>
          <span style="font-size: 7px; color: #a21caf;">Present</span>
        </div>
        <p style="font-size: 8px; font-weight: 600; color: #d8b4fe; margin: 0;">{{targetCompany}}</p>
        <p style="font-size: 8px; line-height: 1.3; color: #e9d5ff; margin: 2px 0 0 0;">{{jobDescription}}</p>
      </div>
    </div>

    <!-- Technical Skills -->
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h4 style="font-size: 9px; font-weight: 700; margin: 0; color: #c084fc; text-transform: uppercase; letter-spacing: 0.05em;">Technical Skills</h4>
      <p style="font-size: 8px; color: #e9d5ff; margin: 0;">{{skills}}</p>
    </div>

    <!-- Education -->
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h4 style="font-size: 9px; font-weight: 700; margin: 0; color: #c084fc; text-transform: uppercase; letter-spacing: 0.05em;">Education</h4>
      <p style="font-size: 8px; color: #e9d5ff; margin: 0;">{{education}}</p>
    </div>
  </div>

  <!-- Footer -->
  <div style="border-top: 1px solid rgba(168,85,247,0.1); padding-top: 4px; display: flex; justify-content: space-between; font-size: 7px; color: #701a75; text-transform: uppercase; font-weight: 600;">
    <span>Aurora Design System Career Builder</span>
    <span>Page 1 of 1</span>
  </div>
</div>
