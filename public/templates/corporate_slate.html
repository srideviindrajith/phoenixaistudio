<div class="resume-container" style="font-family: 'Inter', sans-serif; padding: 16px; color: #f4f4f5; background: #18181b; height: 100%; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;">
  <div style="flex-grow: 1; display: grid; grid-template-columns: 1fr 2fr; gap: 12px; height: 100%;">
    <!-- Left Column (Sidebar) -->
    <div style="border-right: 1px solid rgba(255,255,255,0.06); padding-right: 8px; display: flex; flex-direction: column; gap: 8px;">
      <div>
        <h3 style="font-size: 14px; font-weight: 800; margin: 0; color: #ffffff; text-transform: uppercase;">{{applicantName}}</h3>
        <p style="font-size: 9px; font-weight: 600; margin: 2px 0 0 0; color: #3b82f6;">{{jobTitle}}</p>
      </div>
      <div style="font-size: 7px; color: #a1a1aa; line-height: 1.4;">
        <p style="margin:0;">🌐 {{website}}</p>
        <p style="margin:0;">🐱 {{github}}</p>
      </div>
      <div>
        <h4 style="font-size: 8px; font-weight: 700; margin: 0 0 4px 0; color: #3b82f6; text-transform: uppercase;">Technical Skills</h4>
        <p style="font-size: 7px; color: #d4d4d8; line-height: 1.3;">{{skills}}</p>
      </div>
    </div>

    <!-- Right Column (Main) -->
    <div style="display: flex; flex-direction: column; gap: 8px; padding-left: 4px;">
      <div>
        <h4 style="font-size: 9px; font-weight: 700; margin: 0 0 4px 0; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.05em;">Professional Profile</h4>
        <p style="font-size: 8px; line-height: 1.3; color: #d4d4d8; margin: 0;">{{bio}}</p>
      </div>
      <div>
        <h4 style="font-size: 9px; font-weight: 700; margin: 0 0 4px 0; color: #3b82f6; text-transform: uppercase; letter-spacing: 0.05em;">Experience</h4>
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 9px; font-weight: 700; color: #ffffff;">{{jobTitle}}</span>
        </div>
        <p style="font-size: 8px; font-weight: 600; color: #93c5fd; margin: 0;">{{targetCompany}}</p>
        <p style="font-size: 8px; line-height: 1.3; color: #d4d4d8; margin: 2px 0 0 0;">{{jobDescription}}</p>
      </div>
      <div>
        <h4 style="font-size: 8px; font-weight: 700; margin: 0 0 4px 0; color: #3b82f6; text-transform: uppercase;">Education</h4>
        <p style="font-size: 7px; color: #d4d4d8; margin: 0;">{{education}}</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 4px; display: flex; justify-content: space-between; font-size: 7px; color: #52525b; text-transform: uppercase; font-weight: 600;">
    <span>Corporate Slate Career Builder</span>
    <span>Page 1 of 1</span>
  </div>
</div>
